name: Deploy web (Vercel)

on:
  push:
    branches: [main, claude/sports-weather-app-q0v7we]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Instalamos nosotros mismos desde la raíz del monorepo (con acceso a
      # los workspaces) en vez de dejar que "vercel build" reinstale por su
      # cuenta: su instalación automática, restaurada desde la build cache
      # remota de Vercel entre runs, se quedó pillada devolviendo siempre el
      # mismo recuento de paquetes ("added 125 packages") incluso después de
      # añadir client-only a apps/web/package.json — el árbol cacheado no se
      # invalidaba. Con node_modules ya presente, "vercel build" detecta que
      # existe y no vuelve a instalar por encima.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # client-only es una dependencia implícita de Next (su output tracer la
      # referencia siempre) que npm hoistea a node_modules de la raíz del
      # monorepo. El paso de deploy de Vercel empaqueta la función serverless
      # mirando solo dentro de apps/web (su Root Directory) y no la encuentra
      # ahí, aunque exista en la raíz — falla con "File does not exist:
      # node_modules/client-only/...". La copiamos dentro de apps/web para
      # que quede alcanzable sin depender del hoisting.
      - name: Ensure client-only is present inside apps/web
        run: |
          mkdir -p apps/web/node_modules/client-only
          cp -r node_modules/client-only/. apps/web/node_modules/client-only/

      # Vincula (o crea) el proyecto de Vercel para apps/web. Si prefieres
      # fijarlo explícitamente en vez de re-vincular en cada run, añade los
      # secrets VERCEL_ORG_ID/VERCEL_PROJECT_ID y sustituye este paso por
      # exportar esas dos variables antes de "vercel pull".
      - name: Link Vercel project
        working-directory: apps/web
        run: vercel link --yes --token=${{ secrets.vercel }}

      - name: Pull Vercel environment
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token=${{ secrets.vercel }}

      - name: Build
        working-directory: apps/web
        run: vercel build --prod --token=${{ secrets.vercel }}

      - name: Deploy
        working-directory: apps/web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.vercel }}
