name: Deploy web (Vercel)

on:
  push:
    branches: [main, claude/sports-weather-app-q0v7we]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # "vercel build" + "vercel deploy --prebuilt" (compilar en el runner de
      # GitHub y subir el resultado) tropezaba una y otra vez con
      # dependencias hoisteadas a la raíz del monorepo (client-only, luego
      # @opentelemetry/api, probablemente más) — el paso de deploy sólo
      # empaqueta lo que ve dentro de apps/web y ni "Include source files
      # outside of the Root Directory" (activado en el proyecto) lo arregló.
      # En vez de reproducir a mano cómo Vercel resuelve un monorepo, dejamos
      # que compile en su propia infraestructura (un solo "vercel deploy",
      # sin --prebuilt): es el camino más usado y mejor probado para
      # monorepos con npm workspaces.
      - name: Deploy to Vercel
        working-directory: apps/web
        run: vercel deploy --prod --yes --token=${{ secrets.vercel }}
